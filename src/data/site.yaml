# ---------------------------------------------------------------------
# Call for Papers
# ---------------------------------------------------------------------
cfp:
  intro: "We invite work on data systems that serve AI agents as first-class clients (Thrusts 1–3, our emphasis) and on agents that do data work (Thrust 4)."
  # One short line per thrust. Each thrust becomes a program session.
  thrusts:
    - id: T1
      title: Agent-ready systems
      topics: "storage, query processing, and optimization for agent workloads; sandboxes; agent memory; tool and MCP interfaces"
    - id: T2
      title: Safe agent actions
      topics: "transactions, recovery, and undo; multi-agent concurrency; access control and privacy; security; verification"
    - id: T3
      title: Agent oversight
      topics: "provenance and lineage of agent runs; observability and debugging; trace-based evaluation; human–agent interaction"
    - id: T4
      title: Data agents
      topics: "agents for data discovery, cleaning, integration, and analysis; benchmarks; data quality"

  submission_types:
    - "**Regular papers:** up to 8 pages."
    - "**Short papers:** up to 4 pages (vision, work-in-progress, negative results)."
    - "**Experience reports** on deploying agents over production data systems."
    - "**Already published work:** papers already published or accepted at another venue may be submitted as short papers (up to 4 pages) summarizing the work. These are non-archival."
    - "Page limits exclude references (TBD: confirm)."

  archival:
    - "Regular and short papers are published in the ACM Digital Library as part of the SIGMOD workshop proceedings."
    - "**Exception:** short papers presenting already published or accepted work are **non-archival**. We especially invite authors of relevant SIGMOD/PODS 2027 papers to present their work this way."

  formatting:
    - "Use the ACM [`sigconf` template](https://www.acm.org/publications/proceedings-template)."
    - "**Double-anonymous** review. Each paper gets three reviews: two from database researchers and one from ML/NLP researchers."
    - "Conflicts follow the SIGMOD research-track COI guidelines. Papers under review at SIGMOD 2027 may not be submitted concurrently."
    - "Workshop chairs do not submit papers. A submission conflicted with a chair is handled by another chair (or by a steering-committee member if all chairs are conflicted)."

  # Set to a URL when the submission site (CMT / OpenReview) is ready.
  submission_url: TBD

  presentation:
    - "All accepted papers are presented as posters."
    - "Among accepted papers, the workshop chairs and the program committee select papers for oral presentation (about 15 minutes each, grouped by thrust)."
    - "A best-paper award will be given (sponsor TBD)."


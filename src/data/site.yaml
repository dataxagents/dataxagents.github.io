# ---------------------------------------------------------------------
# Home
# ---------------------------------------------------------------------
overview:
  - "AI agents (LLM-driven programs that plan, call tools, and act over many steps) are quickly becoming both demanding *users* of data systems and a new way to *build* data workflows. When agents issue queries, explore data lakes, and write to tables, their execution must be **efficient**, their actions **safe**, their runs **auditable**, and their data **trustworthy**. These are classic data management problems in a new setting."
  - "**DBxAgents** brings together the database, ML, NLP, and HCI communities to study data systems that treat agents as first-class clients that read *and* write data, and what those systems must guarantee to them."

audience: "Researchers and practitioners in data management who build or study agent-facing systems; agent and NLP researchers whose agents act on data; and industry engineers deploying agents over enterprise data. Students are especially welcome. Diverse and unconventional ideas are welcome as posters."

open_questions:
  - label: Interfaces
    text: "If agents write most code and queries, what interface should a data system expose? Will SQL remain dominant?"
  - label: Internals
    text: "Can agents replace internals such as query optimization, or do these become more important because reasoning over text cannot infer costs from data?"
  - label: Coordination
    text: "Should agents coordinate among themselves, or should coordination be pushed down into the data system?"
  - label: Trust
    text: "What should least privilege, accountability, and consent mean when an agent acts on a person's behalf?"
  - label: State
    text: "Should agents' memory and context be managed by data systems, with the same guarantees as other data?"
  - label: Correctness
    text: "When an agent both asks and checks a question, how should a system convey uncertainty?"

